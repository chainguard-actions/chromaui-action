name: Test logging and diagnostic inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          projectToken: fake-token-for-testing
          skip: true
          debug: true
          diagnostics: true
          diagnosticsFile: chromatic-diagnostics.json
          logFile: chromatic.log
          logLevel: info
          logPrefix: "[chromatic]"
          storybookLogFile: storybook-build.log
          junitReport: chromatic-report.xml
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed with logging/diagnostic inputs"
          echo "PASS"
