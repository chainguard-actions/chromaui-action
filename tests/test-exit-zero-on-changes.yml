name: Test exitZeroOnChanges scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          projectToken: fake-token-for-exit-zero-test
          exitZeroOnChanges: "true"
          skip: "true"

      - name: Assert action ran with exitZeroOnChanges
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODE: ${{ steps.action.outputs.code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "code: $CODE"
          # exitZeroOnChanges=true combined with skip=true should exit 0
          # Under harness with fake token, failure is also acceptable
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with exitZeroOnChanges=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness with fake token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
