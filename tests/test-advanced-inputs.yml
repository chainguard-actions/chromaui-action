name: Test advanced and miscellaneous inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          projectToken: fake-token-for-testing
          skip: true
          appCode: fake-app-code
          allowConsoleErrors: true
          exitOnceUploaded: true
          fileHashing: true
          forceRebuild: true
          ignoreLastBuildOnBranch: main
          repositorySlug: owner/repo
          skipUpdateCheck: true
          token: fake-github-token
          uploadMetadata: true
          zip: true
          playwright: false
          cypress: false
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed with advanced/miscellaneous inputs"
          echo "PASS"
