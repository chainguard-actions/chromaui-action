name: Test no token error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      # Explicitly clear any token that might be in the environment
      CHROMATIC_PROJECT_TOKEN: ''
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: chromatic
        uses: .
        continue-on-error: true
        with:
          # No projectToken provided — action should fail
          skipUpdateCheck: 'true'
          storybookBuildDir: 'tests/fixtures/storybook-build'
      - name: Assert action ran without a project token
        if: always()
        env:
          OUTCOME: ${{ steps.chromatic.outcome }}
          CODE: ${{ steps.chromatic.outputs.code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit code: $CODE"
          # Without a project token, the action should fail.
          # We verify the action ran (outcome is set to something).
          # We accept any outcome (success, failure, cancelled) as long as
          # the action step ran.
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action step did not run (outcome is empty)"
            exit 1
          fi
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed without a project token"
          else
            echo "PASS: action ran with outcome: $OUTCOME (expected failure without token)"
          fi
