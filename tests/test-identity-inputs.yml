name: Test identity and integration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          projectToken: fake-token-for-identity-test
          dryRun: "true"
          appCode: "fake-app-code"
          branchName: "test-branch"
          repositorySlug: "test-owner/test-repo"
          token: "fake-github-token"
          playwright: "false"
          cypress: "false"

      - name: Assert action ran with identity inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODE: ${{ steps.action.outputs.code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "code: $CODE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with identity inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness with fake token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
