name: Test dry run scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          projectToken: fake-token-for-dry-run
          dryRun: "true"

      - name: Assert action ran in dry run mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODE: ${{ steps.action.outputs.code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "code: $CODE"
          # dryRun=true runs without actually publishing to Chromatic.
          # Under the harness with a fake token, the action may fail at auth or succeed
          # with a dry-run exit code. Both are acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in dry run mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness with fake token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
